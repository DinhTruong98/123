# SoundWatch PoC configuration. Single source of truth for all components.
audio:
  sample_rate: 16000
  window_s: 1.0
  hop_s: 0.5
  n_fft: 512
  frame_step: 320
  n_mels: 40
  fmin: 20.0
  fmax: 8000.0
  log_eps: 1.0e-6
  gate_dbfs: -55.0

# WP8 tuning (`python -m soundwatch tune`, val-split scenarios, see artifacts/reports/tuning.md):
# grid smooth_n {1,2,3} x k_of_n {1/1,2/2,2/3,3/4} x bg_margin {off,.2,.4} x per-class thresholds
# (greedy, DANGER recall x2). Constraint median latency <= 1.5 s leaves only smooth_n=1 (or
# smooth_n=2 with k=1/1); with it no setting reaches <= 2 or <= 5 background false alarms/h on val,
# so the 10 FA/h budget was chosen: smooth_n=1, k_of_n=2/2 (two consecutive hops above threshold),
# bg_margin off (it never helped: softmax thresholds >= 0.5 already imply the margin).
# Was smooth_n=3, k_of_n=[2,3] (latency ~2 s). The int8 model is over-confident (outputs saturate at
# 255/256 = 0.996), hence the very high thresholds: 0.99 means "saturated output".
postprocess:
  smooth_n: 1
  k_of_n: [2, 2]
  danger_repeat_s: 5.0
  danger_clear_s: 10.0
  # bg_margin: 0.2   # optional: require smoothed[c] - smoothed[background] >= bg_margin (default off)

model:
  tflite_path: artifacts/models/student_int8.tflite
  stats_path: artifacts/models/feature_stats.json
  # fallback used by `run` when artifacts/ has no trained model yet
  bundled_tflite_path: assets/models/student_int8.tflite
  bundled_stats_path: assets/models/feature_stats.json

ui:
  watch_size: 240
  scale: 2
  window: [960, 600]
  fps: 30
  alert_timeout_s: 6.0
  history_len: 10
  font: assets/fonts/BeVietnamPro-Bold.ttf
  font_regular: assets/fonts/BeVietnamPro-Regular.ttf

# Order = model output index. `background` MUST be last.
# Thresholds: WP8 tuned on val (budget 10 FA/h, see postprocess above); WP7 values were
# smoke_alarm/car_horn/siren 0.60, baby_cry/door_knock 0.70, dog_bark/water_running 0.75.
# level: 0 = info, 1 = warn, 2 = danger
# vibration: on/off durations in ms, alternating, starting with "on" (odd length, or empty)
classes:
  - {key: smoke_alarm,   label_vi: "Báo cháy",            level: 2, icon: fire.png,  color: [230, 40, 40],   vibration: [800, 200, 800, 200, 800], threshold: 0.90, cooldown_s: 3}
  - {key: car_horn,      label_vi: "Còi xe",              level: 2, icon: car.png,   color: [230, 40, 40],   vibration: [150, 100, 150, 100, 150], threshold: 0.97, cooldown_s: 3}
  - {key: siren,         label_vi: "Còi cấp cứu",         level: 2, icon: siren.png, color: [230, 40, 40],   vibration: [600, 150, 200, 150, 600], threshold: 0.99, cooldown_s: 3}
  - {key: baby_cry,      label_vi: "Em bé khóc",          level: 1, icon: baby.png,  color: [255, 140, 0],   vibration: [500, 250, 500],           threshold: 0.99, cooldown_s: 8}
  - {key: door_knock,    label_vi: "Gõ cửa / Chuông cửa", level: 1, icon: door.png,  color: [255, 140, 0],   vibration: [150, 150, 150],           threshold: 0.99, cooldown_s: 8}
  - {key: dog_bark,      label_vi: "Chó sủa",             level: 0, icon: dog.png,   color: [40, 140, 255],  vibration: [200],                     threshold: 0.99, cooldown_s: 15}
  - {key: water_running, label_vi: "Nước chảy",           level: 0, icon: water.png, color: [40, 140, 255],  vibration: [600],                     threshold: 0.99, cooldown_s: 30}
  - {key: background,    label_vi: "Yên tĩnh",            level: 0, icon: ear.png,   color: [120, 120, 120], vibration: [],                        threshold: 1.01, cooldown_s: 0}
