name: SoundWatch
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi
  preGenCommand: scripts/fetch_litert.sh  # LiteRT C library (Packages/LiteRTC)

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64  # LiteRT ships an arm64-only simulator slice

packages:
  LiteRTC:
    path: Packages/LiteRTC

targets:
  SoundWatch:
    type: application
    platform: iOS
    sources:
      - path: SoundWatch
        excludes:
          - Resources/golden_features.json
          - Resources/demo_expected_events.json
    dependencies:
      - package: LiteRTC
        product: TensorFlowLiteC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SW_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(SW_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Time Sensitive notifications need a paid team: set SW_ENTITLEMENTS in Local.xcconfig
        CODE_SIGN_ENTITLEMENTS: $(SW_ENTITLEMENTS)
    info:
      path: SoundWatch/Info.plist
      properties:
        CFBundleDisplayName: SoundWatch
        CFBundleDevelopmentRegion: vi
        NSMicrophoneUsageDescription: "SoundWatch cần dùng micro để nghe âm thanh xung quanh (báo cháy, còi xe, tiếng gõ cửa…) và cảnh báo cho bạn. Âm thanh chỉ được xử lý trên máy, không ghi lại và không gửi đi."
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

  SoundWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SoundWatchTests
      - path: SoundWatch/Resources/golden_features.json
        buildPhase: resources
      - path: SoundWatch/Resources/demo_expected_events.json
        buildPhase: resources
    dependencies:
      - target: SoundWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SW_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(SW_TEAM_ID)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SoundWatch.app/SoundWatch
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  SoundWatch:
    build:
      targets:
        SoundWatch: all
        SoundWatchTests: [test]
    test:
      config: Debug
      targets:
        - SoundWatchTests
    run:
      config: Debug
    archive:
      config: Release
