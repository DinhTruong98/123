[project]
name = "soundwatch"
version = "0.1.0"
description = "Environmental sound recognition watch for deaf and hard-of-hearing users (PC proof-of-concept)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow-cpu==2.21.0",
    "keras==3.15.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "sounddevice==0.5.6",
    "pygame==2.6.1",
    "pyyaml==6.0.3",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "tqdm==4.70.1",
    "imageio==2.38.1",
    "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs downloaded data or trained models (skipped by default)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
